name: Shadow run
# Every 15 minutes (at :07, :22, :37 and :52): load newly published ECB and US Treasury
# data, record the ECB file's Last-Modified time, run FreshCal from PyPI, and commit only
# what changed.
#
# GitHub throttles frequent schedules (observed: a 5-minute cron firing every 3-6 hours),
# so the schedule cannot be the clock. Instead each run works through the 15-minute slots
# itself for about 5.5 hours and then starts the next run; the schedule below only
# restarts the chain if it ever breaks. The concurrency group keeps a single run active.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      run_seconds:
        description: How long this run works through slots (the chain uses the default)
        default: "19800"
permissions: {} # granted per job
concurrency:
  group: shadow-run
  cancel-in-progress: false # a run that is committing must finish
env:
  FRESHCAL_VERSION: "0.1.3"
  # 5.5 hours of slots per run (the job limit is 6 hours); a manual test may shorten it.
  RUN_SECONDS: ${{ inputs.run_seconds || '19800' }}
jobs:
  run:
    name: Load, check and record
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write # commits the collected data back to this repository
      actions: write # starts the next run of this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] the job pushes its data commits; no artifacts are uploaded
      - name: Install FreshCal from PyPI
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "freshcal[duckdb]==${FRESHCAL_VERSION}"
          .venv/bin/freshcal --version
          # FreshCal's own collector, at the released tag; it writes ecb/publications.csv.
          curl -fsSL -o ecb/collect.py "https://raw.githubusercontent.com/JeremyL691/freshcal/v${FRESHCAL_VERSION}/validation/ecb/collect.py"
      - name: Work through the 15-minute slots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export PATH="$PWD/.venv/bin:$PATH"
          case "$RUN_SECONDS" in ""|*[!0-9]*) RUN_SECONDS=19800 ;; esac # digits only
          stop=$(( $(date +%s) + RUN_SECONDS ))
          iterations=0
          while :; do
            iterations=$((iterations + 1))
            echo "::group::slot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --quiet --rebase || echo "pull failed; continuing"
            python ecb/collect.py || echo "collector failed; continuing"
            python shadow.py || echo "shadow.py failed; continuing"
            git add loads ecb/publications.csv results
            if ! git diff --cached --quiet; then
              git commit -q -m "data: shadow run $(date -u +%Y-%m-%dT%H:%MZ)"
              git push --quiet || { git pull --quiet --rebase && git push --quiet; } || echo "push failed; retrying next slot"
            fi
            echo "::endgroup::"
            # Sleep until the next slot (minute 7, 22, 37 or 52 of the hour).
            now=$(date +%s)
            next=$(( (now - 420) / 900 * 900 + 900 + 420 ))
            if [ "$next" -ge "$stop" ]; then break; fi
            sleep $(( next - now ))
          done
          echo "iterations=$iterations" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shadow.yml --repo "$GITHUB_REPOSITORY" --ref main
