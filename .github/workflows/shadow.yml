name: Shadow run
# Every 15 minutes: load newly published ECB and US Treasury data, record the ECB file's
# Last-Modified time, run FreshCal from PyPI, and commit only what changed.
# GitHub runs scheduled workflows on a best-effort basis: runs can start late or be skipped.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions: {} # granted per job
concurrency:
  group: shadow-run
  cancel-in-progress: false # a run that is committing must finish
env:
  FRESHCAL_VERSION: "0.1.3"
jobs:
  run:
    name: Load, check and record
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commits the collected data back to this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] the job pushes its data commit; no artifacts are uploaded
      - name: Install FreshCal from PyPI
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "freshcal[duckdb]==${FRESHCAL_VERSION}"
          .venv/bin/freshcal --version
      - name: Record the ECB file's Last-Modified time
        # FreshCal's own collector, at the released tag; it writes ecb/publications.csv.
        run: |
          curl -fsSL -o ecb/collect.py "https://raw.githubusercontent.com/JeremyL691/freshcal/v${FRESHCAL_VERSION}/validation/ecb/collect.py"
          .venv/bin/python ecb/collect.py || echo "collector failed; continuing"
      - name: Load and check
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python shadow.py
      - name: Commit what changed
        run: |
          git add loads ecb/publications.csv results
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: shadow run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
